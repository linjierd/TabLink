name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-managed-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify cross-platform version contract
        shell: pwsh
        run: .\tools\Test-TabLinkVersionContract.ps1
      - name: Verify GitHub language contract
        shell: pwsh
        run: .\tools\Test-GitHubLanguageContract.ps1
      - name: Verify product localisation contract
        shell: pwsh
        run: .\tools\Test-LocalizationContract.ps1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify Apple localisation resources and project references
        shell: pwsh
        run: |
          python .\native\apple\tools\generate_project.py
          if ($LASTEXITCODE -ne 0) { throw 'Apple Xcode project generation failed.' }
          git diff --exit-code -- .\native\apple\TabLink.xcodeproj
          if ($LASTEXITCODE -ne 0) { throw 'The checked-in Apple Xcode project is stale. Regenerate and commit it.' }
          python .\native\apple\tools\verify_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Apple source verification failed.' }
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify HarmonyOS localisation resources and project references
        shell: pwsh
        run: |
          node .\native\harmony\tests\protocol.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'HarmonyOS protocol verification failed.' }
          node .\native\harmony\tests\update-policy.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'HarmonyOS update verification failed.' }
          node .\native\harmony\tests\project-check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'HarmonyOS source verification failed.' }
      - name: Verify Android presentation measurement contract
        shell: pwsh
        run: .\tools\Test-AndroidPresentationMeasurement.ps1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify compatibility catalog
        shell: pwsh
        run: dotnet run --project .\tools\TabLink.CompatibilityCatalog\TabLink.CompatibilityCatalog.csproj -c Release -- --root . --check
      - name: Build Windows projects
        shell: pwsh
        run: |
          dotnet build .\src\TabLink.Windows\TabLink.Windows.csproj -c Release --nologo
          dotnet build .\src\TabLink.Windows\TabLink.Windows.csproj -c Release --nologo -p:EnableBrowserReceiver=false
          dotnet build .\src\TabLink.DriverSetup\TabLink.DriverSetup.csproj -c Release --nologo
      - name: Run managed tests
        shell: pwsh
        run: |
          $env:NO_PROXY = 'localhost,127.0.0.1,::1'
          $env:no_proxy = $env:NO_PROXY
          $projects = Get-ChildItem .\tests -Filter '*.csproj' -Recurse | Sort-Object FullName
          foreach ($project in $projects) {
            dotnet run --project $project.FullName -c Release
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $($project.FullName)" }
          }

  android-debug-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Verify cross-platform version contract
        shell: pwsh
        run: .\tools\Test-TabLinkVersionContract.ps1
      - name: Verify GitHub language contract
        shell: pwsh
        run: .\tools\Test-GitHubLanguageContract.ps1
      - name: Verify product localisation contract
        shell: pwsh
        run: .\tools\Test-LocalizationContract.ps1
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform and build tools
        shell: pwsh
        run: |
          $androidSdk = @($env:ANDROID_SDK_ROOT, $env:ANDROID_HOME) |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and (Test-Path -LiteralPath $_ -PathType Container) } |
            Select-Object -First 1
          if (-not $androidSdk) { throw 'GitHub Windows runner did not provide an Android SDK.' }
          $platformJar = Join-Path $androidSdk 'platforms\android-35\android.jar'
          $aapt2 = Join-Path $androidSdk 'build-tools\35.0.0\aapt2.exe'
          if (-not (Test-Path -LiteralPath $platformJar -PathType Leaf) -or
              -not (Test-Path -LiteralPath $aapt2 -PathType Leaf)) {
            $sdkManagerCommand = Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
            $sdkManagerPath = if ($sdkManagerCommand) {
              $sdkManagerCommand.Source
            } else {
              Get-ChildItem -LiteralPath (Join-Path $androidSdk 'cmdline-tools') -Filter sdkmanager.bat -File -Recurse |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $sdkManagerPath) { throw 'Android SDK manager was not found on the GitHub Windows runner.' }
            & $sdkManagerPath "--sdk_root=$androidSdk" 'platforms;android-35' 'build-tools;35.0.0'
            if ($LASTEXITCODE -ne 0) { throw 'Android SDK package installation failed.' }
          }
          if (-not (Test-Path -LiteralPath $platformJar -PathType Leaf) -or
              -not (Test-Path -LiteralPath $aapt2 -PathType Leaf)) {
            throw 'Android SDK platform 35 or build-tools 35.0.0 is incomplete.'
          }
          "ANDROID_SDK_ROOT=$androidSdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$androidSdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Run Android JVM tests, debug build, lint, and signature verification
        shell: pwsh
        run: |
          $gradle = Get-Command gradle.bat -ErrorAction SilentlyContinue
          if (-not $gradle) { $gradle = Get-Command gradle -ErrorAction Stop }
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { throw 'Android SDK path was not exported by setup-android.' }
          .\android\build.ps1 -JavaHome $env:JAVA_HOME -AndroidSdk $androidSdk -Gradle $gradle.Source
