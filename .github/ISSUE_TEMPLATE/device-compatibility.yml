name: "Device compatibility / 设备兼容性"
description: "Report compatibility with a particular Windows environment, receiver, GPU, display mode or connection method. / 报告特定 Windows、接收设备、GPU、显示模式或连接方式的兼容性。"
title: "[Compatibility] "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Provide only publicly listed model names and non-unique compatibility information. This page is public. Do not enter or upload serial numbers, USB/PnP IDs (including instance paths), IP or MAC addresses, local or network paths, pairing links, tokens, certificates, keys, raw logs, or diagnostic files that you have not reviewed.

        The Issue body and attachments are only candidate evidence for maintainer review. They are not imported automatically into the public compatibility catalogue and are not downloaded by clients. Maintainers will manually transcribe only public, non-unique fields. The submitter's privacy confirmation and automated validation do not replace manual review.

        请只提供厂商公开型号和非唯一的兼容性信息。这里是公开页面：不要填写或上传序列号、USB/PnP ID（包括实例路径）、IP/MAC 地址、本机或网络路径、配对链接、token、证书、密钥、原始日志或未经检查的诊断文件。

        Issue 正文和附件只是供维护者审查的候选证据，不会自动导入公开兼容性目录，也不会被客户端下载。维护者只会逐字段手工整理公开、非唯一的信息；提交者的隐私确认和自动校验都不能代替人工复核。

  - type: dropdown
    id: report_kind
    attributes:
      label: "Report type / 报告类型"
      options:
        - "Cannot connect or use / 无法连接或无法使用"
        - "Some features do not work correctly / 部分功能异常"
        - "Intermittent compatibility issue / 间歇性兼容问题"
        - "Confirmed working / 确认可以使用"
        - "Other / 其他"
    validations:
      required: true

  - type: input
    id: tablink_version
    attributes:
      label: "TabLink version and build / TabLink 版本与构建"
      placeholder: "Example: Windows 0.8.9 Preview 1; Android 0.8.9 / build 21 / 例如：Windows 0.8.9 Preview 1；Android 0.8.9 / build 21"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: "Windows, PC and GPU environment / Windows、电脑与显卡环境"
      description: "Enter the Windows version/build/architecture, public PC or motherboard model, public GPU model, driver version and the encoder actually used by TabLink. Do not enter a user name, path, serial number, hardware ID or PnP instance ID. / 填写 Windows 版本/build/架构、电脑/主板公开型号、GPU 公开型号、驱动版本和 TabLink 实际编码器。不要填写用户名、路径、序列号、硬件 ID 或 PnP 实例 ID。"
      placeholder: "Example: Windows 11 24H2 build 26100 x64; public PC and GPU models; driver version; NVENC/QSV/AMF/x264 / 例如：Windows 11 24H2 build 26100 x64；电脑与 GPU 公开型号；驱动版本；NVENC/QSV/AMF/x264"
    validations:
      required: true

  - type: input
    id: receiver
    attributes:
      label: "Receiver, system and display capabilities / 接收设备、系统与显示能力"
      description: "Enter whether you used the native Android app or browser client, the manufacturer and public model, the Android/iOS/iPadOS/HarmonyOS/desktop OS version, native orientation, resolution, supported/requested refresh rates and public decoder name. Do not enter the device serial number, USB ID or MAC address. / 填写原生 Android 客户端或浏览器客户端、厂商与公开型号、Android/iOS/iPadOS/HarmonyOS/桌面系统版本、原生方向、分辨率、支持/请求刷新率和 decoder 公开名称。不要填写设备序列号、USB ID 或 MAC 地址。"
      placeholder: "Example: browser client; public model; iPadOS 18; landscape 1920×1200; 60/90 Hz; public decoder name / 例如：浏览器客户端；某厂商公开型号；iPadOS 18；横屏 1920×1200；60/90 Hz；decoder 公开名称"
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: "Connection method / 连接方式"
      options:
        - "Wi-Fi local network / Wi-Fi 局域网"
        - "USB tethering (no debugging required) / USB 网络共享（免调试）"
        - "ADB USB debugging compatibility channel / ADB USB 调试兼容通道"
        - "Browser receiver / 浏览器接收端"
        - "Other / 其他"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to reproduce or verify / 复现或验证步骤"
      description: "List the installation, connection and result-triggering steps in order. Even for a 'Confirmed working' report, describe the workflow that you verified. / 按顺序写出安装、连接和触发结果的步骤。即使报告“可以使用”，也请写出验证过的流程。"
      placeholder: |
        1. Installation step
        2. Connection step
        3. Verification result

        1. 安装步骤
        2. 连接步骤
        3. 验证结果
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: "Expected and actual results / 预期结果与实际结果"
      description: "Describe the expected behaviour and the observed behaviour separately. Do not paste raw logs, stack traces or complete command output. / 分别说明预期行为和观察到的行为；不要粘贴原始日志、堆栈或完整命令输出。"
    validations:
      required: true

  - type: textarea
    id: support_bundle
    attributes:
      label: "Optional: user-selected redacted support bundle / 可选：用户主动附加的脱敏支持包"
      description: "Attach the ZIP generated by 'Export redacted support bundle' only after you have deliberately selected it, previewed it in TabLink and reviewed its contents again. You may leave this blank; TabLink will not upload or attach files automatically. Do not upload raw logs. / 只有在你主动选择、已在 TabLink 中预览并再次检查内容后，才可把“导出脱敏支持包”生成的 ZIP 拖到这里。可以留空；TabLink 不会自动上传或附加文件。不要上传原始日志。"
      placeholder: "Drop a reviewed, redacted support bundle here, or leave this blank. / 可将已检查的脱敏支持包拖入此处，或留空。"

  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: "Public information confirmation / 公开信息确认"
      options:
        - label: "I confirm that this Issue and its attachments contain no serial numbers, USB/PnP IDs, IP/MAC addresses, paths, pairing links, tokens, certificates, keys or raw logs. If I attached a support bundle, I deliberately reviewed and selected it. / 我已确认本 Issue 及附件不含序列号、USB/PnP ID、IP/MAC、路径、配对链接、token、证书、密钥或原始日志；支持包如有附加，是我主动检查并选择的。"
          required: true
