name: "Performance issue / 性能问题"
description: "Report frame rate, latency, stuttering, resource usage or sustained-operation issues. / 报告帧率、延迟、卡顿、资源占用或持续运行方面的问题。"
title: "[Performance] "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Performance data can be compared only when the conditions are complete. This page is public. Do not enter or upload device serial numbers, USB/PnP IDs, IP or MAC addresses, local or network paths, pairing links, tokens, certificates, keys, raw logs, or diagnostic files that you have not reviewed.

        性能数据需要完整条件才能比较。这里是公开页面：请勿填写或上传设备序列号、USB/PnP ID、IP/MAC 地址、本机或网络路径、配对链接、token、证书、密钥、原始日志或未经检查的诊断文件。

  - type: input
    id: tablink_version
    attributes:
      label: "TabLink version and build / TabLink 版本与构建"
      placeholder: "Example: Windows 0.8.9 Preview 1; Android 0.8.9 / build 21 / 例如：Windows 0.8.9 Preview 1；Android 0.8.9 / build 21"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: "Windows version and hardware overview / Windows 版本与硬件概况"
      description: "Enter the Windows version/build/architecture, public CPU and GPU models, and graphics driver version. Do not enter a unique hardware ID, user name or path. / 填写 Windows 版本/build/架构，以及 CPU、GPU 的公开型号和显卡驱动版本。不要填写硬件唯一 ID、用户名或路径。"
      placeholder: "Example: Windows 11 24H2 build 26100 x64; public GPU model; driver version / 例如：Windows 11 24H2 build 26100 x64；GPU 公开型号；驱动版本"
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: "Android device and system / Android 设备与系统"
      description: "Enter the public model, Android version/API, screen resolution and refresh rate. Do not enter a serial number or USB/PnP ID. / 填写公开型号、Android 版本/API、屏幕分辨率和刷新率；不要填写序列号或 USB/PnP ID。"
      placeholder: "Example: public model from the manufacturer; Android 14 / API 34; 1920×1200 @ 90 Hz / 例如：某厂商公开型号；Android 14 / API 34；1920×1200 @ 90 Hz"
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: "Connection method / 连接方式"
      options:
        - "Wi-Fi local network / Wi-Fi 局域网"
        - "USB tethering (no debugging required) / USB 网络共享（免调试）"
        - "ADB USB debugging compatibility channel / ADB USB 调试兼容通道"
        - "Browser receiver / 浏览器接收端"
        - "Other / 其他"
    validations:
      required: true

  - type: textarea
    id: measurements
    attributes:
      label: "Display settings, measurements and comparison baseline / 画面设置、测量结果与对照基线"
      description: "Enter the resolution, requested refresh rate, quality preset, actual encoder and software fallback status. Then record the sending, decoder-submission, presentation-callback, physical-panel or resource-usage data, measurement duration/tool, and expected value or previous-version baseline. Do not present requested Hz as measured fps. / 填写分辨率、请求刷新率、质量预设、实际编码器和软件回退状态；再分别写出发送、解码提交、呈现回调、物理面板或资源占用数据、测量时长/工具，以及预期值或旧版对照。不要把请求 Hz 当作实测 fps。"
      placeholder: |
        Settings: …
        Measurement duration and tool: …
        Sending/submission/callback/panel/resource usage: …
        Expected value or previous-version baseline: …

        设置：…
        测量时长与工具：…
        发送/提交/回调/面板/资源占用：…
        预期或旧版对照：…
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to reproduce and workload / 复现步骤与负载"
      description: "List the connection method, display settings, foreground content, run duration and actions immediately before the issue appeared. / 列出连接、显示设置、前台内容、运行时长，以及问题出现前的操作。"
      placeholder: |
        1. Connection and display settings
        2. Workload and run duration
        3. Action and observed result

        1. 连接与显示设置
        2. 负载与运行时长
        3. 操作与观察到的结果
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: "Reproduction consistency / 复现稳定性"
      options:
        - "Every time / 每次都发生"
        - "Often / 经常发生"
        - "Occasionally / 偶尔发生"
        - "Only after sustained operation / 只在长时间运行后发生"
        - "Only once / 只发生过一次"
    validations:
      required: true

  - type: textarea
    id: support_bundle
    attributes:
      label: "Optional: user-selected redacted support bundle / 可选：用户主动附加的脱敏支持包"
      description: "Attach the ZIP generated by 'Export redacted support bundle' only after you have deliberately selected it, previewed it in TabLink and reviewed its contents again. You may leave this blank; TabLink will not upload or attach files automatically. Do not upload raw logs. / 只有在你主动选择、已在 TabLink 中预览并再次检查内容后，才可把“导出脱敏支持包”生成的 ZIP 拖到这里。可以留空；TabLink 不会自动上传或附加文件。不要上传原始日志。"
      placeholder: "Drop a reviewed, redacted support bundle here, or leave this blank. / 可将已检查的脱敏支持包拖入此处，或留空。"

  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: "Public information confirmation / 公开信息确认"
      options:
        - label: "I confirm that this Issue and its attachments contain no serial numbers, USB/PnP IDs, IP/MAC addresses, paths, pairing links, tokens, certificates, keys or raw logs. If I attached a support bundle, I deliberately reviewed and selected it. / 我已确认本 Issue 及附件不含序列号、USB/PnP ID、IP/MAC、路径、配对链接、token、证书、密钥或原始日志；支持包如有附加，是我主动检查并选择的。"
          required: true
